<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">CyberHinsight v2 — Chat-First Architecture</text>
  <text x="500" y="68" text-anchor="middle" fill="#14b8a6" font-size="13" font-family="monospace">CONVERSATIONAL SOC ASSISTANT POWERED BY HINDSIGHT PERSISTENT MEMORY &amp; GROQ</text>

  <!-- 1. Client Layer -->
  <rect x="40" y="100" width="220" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="128" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace">1. CLIENT INTERFACE</text>
  
  <rect x="55" y="145" width="190" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="172" fill="#ffffff" font-size="13" font-weight="600">SOC Analyst Chat UI</text>
  <text x="70" y="192" fill="#94a3b8" font-size="11">React 18 + Vite · SSE Streaming</text>
  <text x="70" y="208" fill="#14b8a6" font-size="10" font-family="monospace">Claude-like calm interface</text>

  <rect x="55" y="235" width="190" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="262" fill="#ffffff" font-size="13" font-weight="600">SIEM Alert Ingest</text>
  <text x="70" y="282" fill="#94a3b8" font-size="11">POST /api/ingest/alert</text>
  <text x="70" y="298" fill="#10b981" font-size="10" font-family="monospace">Sentinel · Splunk · CrowdStrike</text>

  <!-- Arrow: Client -> Gateway -->
  <path d="M 260 215 L 320 215" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="205" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace">/api/chat</text>

  <!-- 2. Gateway & Intent Router -->
  <rect x="320" y="100" width="280" height="520" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="340" y="128" fill="#14b8a6" font-size="11" font-weight="700" font-family="monospace">2. FASTAPI &amp; INTENT ROUTER</text>

  <!-- Router box -->
  <rect x="340" y="145" width="240" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="170" fill="#ffffff" font-size="12" font-weight="600">Deterministic Intent Router</text>
  <text x="355" y="188" fill="#94a3b8" font-size="10">Regex IOC rules + Groq classification fallback</text>

  <!-- 4 Handlers -->
  <rect x="340" y="220" width="240" height="85" rx="8" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="355" y="244" fill="#14b8a6" font-size="12" font-weight="600">A. Investigate Handler</text>
  <text x="355" y="262" fill="#94a3b8" font-size="10">• Deterministic IOC extraction</text>
  <text x="355" y="278" fill="#94a3b8" font-size="10">• Recall past precedents &amp; correlate campaigns</text>
  <text x="355" y="294" fill="#94a3b8" font-size="10">• Retain verified findings into memory</text>

  <rect x="340" y="320" width="240" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="344" fill="#ffffff" font-size="12" font-weight="600">B. Ask History Handler</text>
  <text x="355" y="362" fill="#94a3b8" font-size="10">• Strict grounded recall (never invent facts)</text>
  <text x="355" y="378" fill="#94a3b8" font-size="10">• Returns real sources with relevance scores</text>

  <rect x="340" y="410" width="240" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="434" fill="#ffffff" font-size="12" font-weight="600">C. Teach Handler</text>
  <text x="355" y="452" fill="#94a3b8" font-size="10">• Retains analyst feedback (effective/failed)</text>
  <text x="355" y="468" fill="#94a3b8" font-size="10">• Adapts future prompts &amp; playbooks</text>

  <rect x="340" y="495" width="240" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="519" fill="#ffffff" font-size="12" font-weight="600">D. General Handler</text>
  <text x="355" y="537" fill="#94a3b8" font-size="10">Practical defensive security guidance</text>

  <rect x="340" y="565" width="240" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="589" fill="#cbd5e1" font-size="10" font-family="monospace">ChatStore: Atomic JSON · 20 Turn Cap</text>

  <!-- Arrows: Gateway -> Intelligence -->
  <path d="M 580 260 L 670 200" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 580 260 L 670 420" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 580 355 L 670 420" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 580 445 L 670 480" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3. Groq Acceleration -->
  <rect x="670" y="100" width="290" height="200" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="690" y="128" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace">3. GROQ INFERENCE ACCELERATION</text>
  
  <rect x="690" y="145" width="250" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="705" y="170" fill="#ffffff" font-size="12" font-weight="600">Structured JSON Diagnostics</text>
  <text x="705" y="188" fill="#94a3b8" font-size="10">Validation retry with feedback loop</text>
  <text x="705" y="200" fill="#38bdf8" font-size="9" font-family="monospace">openai/gpt-oss-120b</text>

  <rect x="690" y="220" width="250" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="705" y="245" fill="#ffffff" font-size="12" font-weight="600">Real-Time Token Streaming</text>
  <text x="705" y="263" fill="#94a3b8" font-size="10">Grounded history Q&amp;A generation</text>
  <text x="705" y="275" fill="#38bdf8" font-size="9" font-family="monospace">Server-Sent Events (SSE)</text>

  <!-- 4. Hindsight Memory -->
  <rect x="670" y="320" width="290" height="300" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="690" y="348" fill="#14b8a6" font-size="11" font-weight="700" font-family="monospace">4. HINDSIGHT CLOUD VECTOR MEMORY</text>

  <rect x="690" y="365" width="250" height="65" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
  <text x="705" y="390" fill="#14b8a6" font-size="12" font-weight="600">arecall() — Precedent Retrieval</text>
  <text x="705" y="408" fill="#94a3b8" font-size="10">Semantic search with empirical score ranking</text>
  <text x="705" y="420" fill="#cbd5e1" font-size="9" font-family="monospace">budget: mid · tags_match: any</text>

  <rect x="690" y="440" width="250" height="75" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
  <text x="705" y="465" fill="#14b8a6" font-size="12" font-weight="600">aretain() — Structured Storage</text>
  <text x="705" y="483" fill="#94a3b8" font-size="10">Incident telemetry, outcomes &amp; analyst notes</text>
  <text x="705" y="497" fill="#cbd5e1" font-size="9" font-family="monospace">tags: [incident, outcome, cat, sev]</text>

  <rect x="690" y="525" width="250" height="75" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
  <text x="705" y="550" fill="#14b8a6" font-size="12" font-weight="600">areflect() — Pattern Synthesis</text>
  <text x="705" y="568" fill="#94a3b8" font-size="10">Synthesizes "What I've Learned" playbook</text>
  <text x="705" y="582" fill="#cbd5e1" font-size="9" font-family="monospace">budget: high · cross-ticket learning</text>
</svg>
